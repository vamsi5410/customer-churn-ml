services:
  - type: web
    name: churnai-api
    runtime: python
    buildCommand: pip install -r requirements.txt && python -m src.generate_data && python -m src.train
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./churnai.db
